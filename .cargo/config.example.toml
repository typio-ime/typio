# Example Cargo configuration for local development.
#
# To use this configuration locally:
#   cp .cargo/config.example.toml .cargo/config.toml
#
# Note: `.cargo/config.toml` is ignored by Git, allowing individual developers
# to customize their local toolchain and build acceleration settings without
# affecting other environments.

[alias]
xtask = "run --package xtask --"

[build]
# Optional compiler cache wrapper. Requires `sccache` in your PATH.
# rustc-wrapper = "sccache"

# Keep bare Cargo builds on the optimized native Optics tree with static Optics
# bundling enabled (the workspace dependency also enables the facade's `static`
# feature). Explicit shell variables still take precedence, so contributor
# builds can select a debugoptimized tree or `OPTICS_DYNAMIC=1` when needed.
[env]
OPTICS_BUILD_DIR = { value = "../optics/build-release", relative = true }
OPTICS_SOURCE_DIR = { value = "../optics", relative = true }
OPTICS_STATIC = "1"
