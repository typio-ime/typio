# Local-only source patches for cross-repository development.
#
# Enable this file only in a linked Typio worktree:
#   cp .cargo/optics-local.toml .cargo/config.toml
#   git config core.hooksPath .githooks
#
# The generated .cargo/config.toml is ignored by Git. Cargo resolves a local
# lockfile in that worktree; the repository hook keeps the local lockfile out
# of commits. Remove the generated file before promoting an Optics release.
[patch."https://github.com/ming2k/optics"]
# The facade's path dependencies resolve the rest of the unified Optics
# workspace (`crates/*`) from the sibling checkout.
optics = { path = "../optics/crates/optics" }

# Override points for the native Optics C libraries. Typio bundles Optics
# statically (`OPTICS_STATIC = "1"`) while keeping system libraries dynamic, so
# binaries carry no Optics shared-library dependencies or build-tree rpaths.
# Point OPTICS_BUILD_DIR at a release Meson tree built with static archives
# (`default_library=both` or `default_library=static`, e.g. `../optics/build-release`
# or `../optics/build-static-release`). Override with `OPTICS_DYNAMIC=1` in the
# shell if you explicitly need shared-library linking.
[env]
OPTICS_BUILD_DIR = { value = "../optics/build-release", relative = true }
OPTICS_SOURCE_DIR = { value = "../optics", relative = true }
OPTICS_STATIC = "1"
