[package]
name = "libtypio"
version = "0.6.0"
edition = "2021"
authors = ["Typio Contributors"]
license = "MIT"

[lib]
name = "typio"
crate-type = ["cdylib", "rlib"]

[dependencies]
typio-abi = { workspace = true }
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
libc = "0.2"
lazy_static = "1.5"
log = "0.4"
nix = { version = "0.31", features = ["event", "time"] }
