name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  OPTICS_PINNED_REF: c6870eaa5ec724d55ae41b316e4e4424e9ccf67f

jobs:
  cargo-check-format-lint:
    name: Check, Format, and Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build pkg-config \
            libwayland-dev wayland-protocols libxkbcommon-dev \
            libpipewire-0.3-dev \
            libfreetype6-dev libharfbuzz-dev libfontconfig-dev \
            libvulkan-dev glslang-tools

      - name: Clone optics (pinned)
        run: |
          git clone --filter=blob:none \
            https://github.com/ming2k/optics.git \
            ${{ github.workspace }}/../optics
          git -C ${{ github.workspace }}/../optics checkout --detach \
            ${{ env.OPTICS_PINNED_REF }}

      - name: Build optics
        run: |
          meson setup ${{ github.workspace }}/../optics/build \
            --prefix="$HOME/.local" -Dtext=true --buildtype=debugoptimized
          meson compile -C ${{ github.workspace }}/../optics/build

      - name: Cargo fmt
        # At a virtual workspace root, cargo fmt already checks every member.
        # --all also traverses local path dependencies such as sibling optics.
        run: cargo fmt -- --check

      - name: Cargo clippy
        env:
          FLUX_BUILD_DIR: ${{ github.workspace }}/../optics/build
          FLUX_SOURCE_DIR: ${{ github.workspace }}/../optics/libs/flux
          LENS_BUILD_DIR: ${{ github.workspace }}/../optics/build
          LENS_SOURCE_DIR: ${{ github.workspace }}/../optics
          IRIS_BUILD_DIR: ${{ github.workspace }}/../optics/build
          IRIS_SOURCE_DIR: ${{ github.workspace }}/../optics
        run: cargo clippy --workspace --all-targets -- -D warnings

  cargo-test:
    name: Cargo build & test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build pkg-config \
            libwayland-dev wayland-protocols libxkbcommon-dev \
            libpipewire-0.3-dev \
            libfreetype6-dev libharfbuzz-dev libfontconfig-dev \
            libvulkan-dev glslang-tools

      - name: Clone optics (pinned)
        run: |
          git clone --filter=blob:none \
            https://github.com/ming2k/optics.git \
            ${{ github.workspace }}/../optics
          git -C ${{ github.workspace }}/../optics checkout --detach \
            ${{ env.OPTICS_PINNED_REF }}

      - name: Build optics
        run: |
          meson setup ${{ github.workspace }}/../optics/build \
            --prefix="$HOME/.local" -Dtext=true --buildtype=debugoptimized
          meson compile -C ${{ github.workspace }}/../optics/build

      - name: Cargo test
        env:
          FLUX_BUILD_DIR: ${{ github.workspace }}/../optics/build
          FLUX_SOURCE_DIR: ${{ github.workspace }}/../optics/libs/flux
          LENS_BUILD_DIR: ${{ github.workspace }}/../optics/build
          LENS_SOURCE_DIR: ${{ github.workspace }}/../optics
          IRIS_BUILD_DIR: ${{ github.workspace }}/../optics/build
          IRIS_SOURCE_DIR: ${{ github.workspace }}/../optics
          # typio-vet tests dlopen against the mock host
          LD_LIBRARY_PATH: ${{ github.workspace }}/target/debug:${{ github.workspace }}/../optics/build
        run: |
          cargo build --workspace
          cargo test --workspace

  cargo-audit:
    name: RustSec audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit locked dependencies
        run: cargo audit
