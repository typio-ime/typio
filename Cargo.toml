[workspace]
resolver = "2"
members = [
    "crates/typio-client",
    "crates/typio-runtime",
    "crates/typio-engine-manifest",
    "crates/typio-engine-protocol",
    "crates/typio-control",
    "crates/typio-settings",
    "crates/typio-daemon",
    "crates/typio-host-platform",
    "crates/typio-host-types",
    "crates/typio-engine-check",
    "crates/xtask",
]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/ming2k/typio"
rust-version = "1.85"

[workspace.dependencies]
# Wayland client (Smithay project) + scanner for codegen from local XMLs.
#
# We deliberately do NOT depend on the `wayland-protocols` crate. Reasons:
#   - typio's two critical protocols (input-method-v2 and
#     virtual-keyboard-v1) are not shipped there anyway (as of 0.32.13
#     only input-method-v1 is)
#   - this repo ships all needed XMLs in protocols/; generating Rust
#     bindings from them keeps a single source of truth for protocol XMLs
#   - avoids splitting protocols across "from crate" vs "from local XML"
#
# bitflags + wayland-backend are direct deps because the code emitted by
# wayland_scanner references them by crate name (same reason the
# wayland-protocols crate itself lists them as direct deps).
wayland-client = "0.31"
wayland-scanner = "0.31.11"
wayland-backend = { version = "0.3", features = ["client_system"] }
bitflags = "2"
inotify = "0.11"
nix = { version = "0.31", features = ["time", "event", "socket", "fs", "user"] }
libc = "0.2"
# zbus's blocking-api wraps an async runtime (async-io by default). The
# blocking-api feature gives us Connection::system() and receive_signal()
# — the sync API surface we use from the logind worker thread.
zbus = { version = "5", default-features = true, features = ["blocking-api"] }
xkbcommon = "0.9"

# optics (rendering engine and UI stack) Rust bindings.
# The canonical build resolves the binding sources from the tagged optics
# monorepo and links the C libraries discovered by pkg-config. A linked
# development worktree can patch these sources through
# .cargo/optics-local.toml without making a sibling checkout mandatory for CI
# or downstream packagers.
flux-sys = { git = "https://github.com/ming2k/optics", tag = "v0.0.42" }
flux-text-sys = { git = "https://github.com/ming2k/optics", tag = "v0.0.42" }
iris = { git = "https://github.com/ming2k/optics", tag = "v0.0.42" }
iris-sys = { git = "https://github.com/ming2k/optics", tag = "v0.0.42" }
lens-sys = { git = "https://github.com/ming2k/optics", tag = "v0.0.42" }
wayland-sys = "0.31"
tracing = "0.1"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The framework runtime and engine protocol live in this workspace so daemon,
# protocol, and check changes can land atomically.
typio-runtime = { path = "crates/typio-runtime" }
typio-engine-manifest = { path = "crates/typio-engine-manifest" }
typio-engine-protocol = { path = "crates/typio-engine-protocol" }
typio-engine-check = { path = "crates/typio-engine-check" }
typio-daemon = { path = "crates/typio-daemon" }
typio-control = { path = "crates/typio-control" }
typio-host-platform = { path = "crates/typio-host-platform" }
typio-host-types = { path = "crates/typio-host-types" }
typio-client = { path = "crates/typio-client" }
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
