[workspace]
resolver = "2"
members = [
    "crates/typio-client",
    "crates/typio-core",
    "crates/typio-abi",
    "crates/typioctl",
    "crates/typio-settings",
    "crates/typio-host",
    "crates/typio-host-platform",
    "crates/typio-host-types",
    "crates/typio-vet",
    "crates/xtask",
]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/ming2k/typio"
rust-version = "1.85"

[workspace.dependencies]
# Wayland client (Smithay project) + scanner for codegen from local XMLs.
#
# We deliberately do NOT depend on the `wayland-protocols` crate. Reasons:
#   - typio's two critical protocols (input-method-v2 and
#     virtual-keyboard-v1) are not shipped there anyway (as of 0.32.13
#     only input-method-v1 is)
#   - this repo ships all needed XMLs in protocols/; generating Rust
#     bindings from them keeps a single source of truth for protocol XMLs
#   - avoids splitting protocols across "from crate" vs "from local XML"
#
# bitflags + wayland-backend are direct deps because the code emitted by
# wayland_scanner references them by crate name (same reason the
# wayland-protocols crate itself lists them as direct deps).
wayland-client = "0.31"
wayland-scanner = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
bitflags = "2"
inotify = "0.11"
nix = { version = "0.31", features = ["time", "event", "socket", "fs", "user"] }
libc = "0.2"
# zbus's blocking-api wraps an async runtime (async-io by default). The
# blocking-api feature gives us Connection::system() and receive_signal()
# — the sync API surface we use from the logind worker thread.
zbus = { version = "5", default-features = true, features = ["blocking-api"] }
xkbcommon = "0.9"

flux-sys = { path = "../optics/bindings/flux-rs/crates/flux-sys" }
flux-text-sys = { path = "../optics/bindings/flux-rs/crates/flux-text-sys" }
iris = { path = "../optics/bindings/iris-rs/crates/iris" }
iris-sys = { path = "../optics/bindings/iris-rs/crates/iris-sys" }
lens-sys = { path = "../optics/bindings/lens-rs/crates/lens-sys" }
wayland-sys = "0.31"
tracing = "0.1"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The framework library and its ABI headers live in this workspace so host,
# ABI, and vet changes can land atomically.
typio-core = { path = "crates/typio-core" }
typio-abi = { path = "crates/typio-abi" }
typio-host-platform = { path = "crates/typio-host-platform" }
typio-host-types = { path = "crates/typio-host-types" }
typio-client = { path = "crates/typio-client" }
clap = { version = "4", features = ["derive"] }

# wayland-scanner 0.31.10 pins quick-xml 0.39, which is affected by
# RUSTSEC-2026-0194 and RUSTSEC-2026-0195. Keep the published scanner source
# with upstream's dependency-only quick-xml 0.41 fix until a new crate release
# is available. See third-party/wayland-scanner/README.typio.md.
[patch.crates-io]
wayland-scanner = { path = "third-party/wayland-scanner" }

[profile.release]
opt-level = 3
lto = "thin"
